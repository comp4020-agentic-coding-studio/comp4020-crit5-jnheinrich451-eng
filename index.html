<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operation Vector</title>
    <meta
      name="description"
      content="Fly an F-15E off a carrier deck, out over open water and into contested terrain. A browser flight game with no tutorial."
    />

    <!--
      The link-preview card: public/card.png, 1200x630. The URL resolves
      against this page, like any link. No og:title/og:description: scrapers
      fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

    <style>
      /* All CSS lives here, per CLAUDE.md §3. */
      :root {
        --green: #8ef0c8;
        --amber: #ffd79a;
        --salmon: #ff9b7a;
        --cyan: #9fd7ff;
        --yellow: #ffd400;
        --ink: #04080c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        color: var(--green);
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas,
          monospace;
      }

      #view {
        display: block;
        width: 100vw;
        height: 100dvh;
        touch-action: none;
      }

      /* ── the opening screen ────────────────────────────────────────────
         The brief's no-tutorial rule means this screen carries no
         instructions. It carries the aircraft's name and then gets out of
         the way; the catapult sequence in stage 4 is what teaches the
         throttle and the camera, by flying itself once. */
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.6rem;
        text-align: center;
        background: var(--ink);
        z-index: 20;
        transition: opacity 0.6s ease;
      }

      #loading[hidden] {
        display: grid;
        opacity: 0;
        pointer-events: none;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 5vw, 3rem);
        font-weight: 500;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        color: var(--green);
      }

      #loading p {
        margin: 0;
        letter-spacing: 0.3em;
        font-size: 0.7rem;
        color: var(--cyan);
        opacity: 0.65;
      }

      /* ── developer rail (H) ────────────────────────────────────────────
         Off by default: a player must never open this page and find a wall
         of telemetry. Width is BOUNDED rather than content-sized -- §16
         makes the same point about the HUD's instrument columns, and for
         the same reason: a panel that grows with its longest string will
         eventually cover the thing it is describing. */
      #rail {
        position: fixed;
        top: 0.75rem;
        left: 0.75rem;
        margin: 0;
        padding: 0.7rem 0.9rem;
        width: 26rem;
        max-width: calc(100vw - 1.5rem);
        overflow: hidden;
        font-size: 0.72rem;
        line-height: 1.55;
        white-space: pre;
        color: var(--green);
        background: rgb(4 8 12 / 0.72);
        border: 1px solid rgb(142 240 200 / 0.25);
        border-radius: 3px;
        z-index: 10;
        pointer-events: none;
      }

      /* ── rotate affordance ─────────────────────────────────────────────
         Shown only in portrait, and deliberately NOT a blocking overlay:
         the game stays playable behind it, so a marker who never rotates
         still gets a working prototype rather than a wall. It carries no
         words for the same reason the rest of the page doesn't -- a
         rotating-phone glyph is a device affordance, not a tutorial. */
      #rotate {
        position: fixed;
        left: 50%;
        bottom: 2.2rem;
        translate: -50% 0;
        z-index: 15;
        display: none;
        opacity: 0.55;
        animation: nudge 2.6s ease-in-out infinite;
        pointer-events: none;
      }

      #rotate svg {
        display: block;
        width: 3rem;
        height: 3rem;
      }

      @keyframes nudge {
        0%,
        62%,
        100% {
          rotate: 0deg;
        }
        80%,
        92% {
          rotate: -90deg;
        }
      }

      @media (orientation: portrait) {
        #rotate {
          display: block;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #rotate {
          animation: none;
          rotate: -90deg;
        }
      }

      #fade {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        z-index: 18;
        pointer-events: none;
      }

      #crash-flash {
        position: fixed;
        inset: 0;
        background: #ffd2b0;
        opacity: 0;
        z-index: 19;
        pointer-events: none;
      }

      #complete {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 1.1rem;
        text-align: center;
        background: rgb(4 8 12 / 0.86);
        z-index: 19;
      }

      #complete[hidden] {
        display: none;
      }

      #complete-title {
        margin: 0;
        font-size: clamp(1.1rem, 3.2vw, 1.8rem);
        letter-spacing: 0.36em;
        text-indent: 0.36em;
        color: var(--green);
      }

      #complete-rows {
        margin: 0;
        display: grid;
        grid-template-columns: auto auto;
        gap: 0.35rem 1.6rem;
        font-size: 0.78rem;
        letter-spacing: 0.14em;
        color: var(--cyan);
      }

      #complete-rows dt {
        text-align: right;
        opacity: 0.65;
      }

      #complete-rows dd {
        margin: 0;
        text-align: left;
        color: var(--green);
      }

      nav {
        position: fixed;
        right: 0.75rem;
        bottom: 0.6rem;
        z-index: 10;
        font-size: 0.62rem;
        letter-spacing: 0.2em;
      }

      nav a {
        color: var(--cyan);
        opacity: 0.35;
        text-decoration: none;
      }

      nav a:hover,
      nav a:focus-visible {
        opacity: 0.9;
      }

      @media (prefers-reduced-motion: reduce) {
        #loading {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="loading">
      <h1>Operation Vector</h1>
      <p>F-15E</p>
    </div>

    <!-- The failure fade. The checkpoint restore happens at FULL BLACK, so
         the player never sees the teleport. -->
    <div id="fade"></div>

    <!-- The completion screen. `R` or Enter restarts -- Enter ONLY from here,
         because it is a fire key in flight. -->
    <div id="complete" hidden>
      <p id="complete-title">SORTIE COMPLETE</p>
      <dl id="complete-rows"></dl>
    </div>

    <!-- ABOVE the fade, and a SEPARATE element, so neither can strand the
         other on. Under 0.15 s, low alpha. -->
    <div id="crash-flash"></div>

    <pre id="rail" hidden></pre>

    <div id="rotate" role="img" aria-label="Turn the device sideways to fly">
      <svg viewBox="0 0 24 24" fill="none" stroke="#9fd7ff" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="8" y="2" width="8" height="20" rx="1.6" />
        <line x1="10.6" y1="4.4" x2="13.4" y2="4.4" />
        <path d="M4.2 15.4a8 8 0 0 1 0-6.8" />
        <path d="M19.8 8.6a8 8 0 0 1 0 6.8" />
        <polyline points="2.6,12.4 4.2,15.6 5.9,12.6" />
        <polyline points="21.4,11.6 19.8,8.4 18.1,11.4" />
      </svg>
    </div>

    <nav aria-label="Primary">
      <a href="./tests.html">checks</a>
    </nav>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
