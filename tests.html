<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operation Vector checks</title>
    <meta
      name="description"
      content="The assertion suite for Operation Vector: flight envelope, turn coupling, throttle, input robustness and the no-pointer rule."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

    <style>
      :root {
        --green: #8ef0c8;
        --salmon: #ff9b7a;
        --cyan: #9fd7ff;
        --ink: #04080c;
      }

      body {
        margin: 0;
        padding: 2rem 1.25rem 4rem;
        background: var(--ink);
        color: var(--green);
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas,
          monospace;
        font-size: 0.82rem;
        line-height: 1.6;
      }

      main {
        max-width: 60rem;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 0.3rem;
        font-size: 1rem;
        font-weight: 500;
        letter-spacing: 0.3em;
      }

      nav {
        margin-bottom: 2rem;
        font-size: 0.68rem;
        letter-spacing: 0.2em;
      }

      nav a {
        color: var(--cyan);
        text-decoration: none;
        opacity: 0.7;
      }

      nav a:hover,
      nav a:focus-visible {
        opacity: 1;
      }

      #count {
        font-size: 1.35rem;
        letter-spacing: 0.1em;
        margin: 0 0 1.4rem;
      }

      .red {
        color: var(--salmon);
      }

      #failures {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      #failures li {
        padding: 0.35rem 0 0.35rem 0.9rem;
        border-left: 2px solid var(--salmon);
        margin-bottom: 0.4rem;
        color: var(--salmon);
      }

      #failures em {
        display: block;
        font-style: normal;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Operation Vector checks</h1>
      <nav aria-label="Primary"><a href="./">&larr; back to the game</a></nav>
      <p id="count">running&hellip;</p>
      <ul id="failures"></ul>
    </main>

    <script type="module">
      // The same suite the repository gate runs, so the count on this page
      // and the result in CI can never disagree about what passed.
      import { run } from "./src/flight.test.js";

      const result = run();
      const count = document.getElementById("count");
      count.textContent = `${result.passed} passed · ${result.failed} failed`;
      if (result.failed > 0) count.classList.add("red");

      const list = document.getElementById("failures");
      for (const failure of result.failures) {
        const li = document.createElement("li");
        li.textContent = failure.name;
        if (failure.detail) {
          const em = document.createElement("em");
          em.textContent = failure.detail;
          li.append(em);
        }
        list.append(li);
      }
    </script>
  </body>
</html>
